[project]
name = "yaoya-transcripts"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "faster-whisper>=1.2.1,<2",
  "nvidia-cublas-cu12>=12,<13",
  "nvidia-cudnn-cu12>=9,<10",
  "pyannote.audio>=3.3.2,<4",
  "torch>=2.5,<2.6",
  "torchaudio>=2.5,<2.6",
  "scikit-learn>=1.5,<2",
  "soundfile>=0.13,<1",
  "pydantic>=2.10,<3",
  "huggingface-hub<0.26",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchaudio = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
