name: Podcast Parser

on:
  schedule:
    - cron: '0 12 * * 1'
  push:
    branches:
      - main
env:
  RSS_FEED_URL: ${{ vars.RSS_FEED_URL }}

permissions:
  contents: write

jobs:
  parse_podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install node
        uses: actions/setup-node@v2

      - name: Install dependencies
        run: |
          npm install rss-parser

      - name: Parse Podcast RSS Feed
        id: parse_feed
        run: |
          node ./scripts/parsePodcast.js  # This script should handle the RSS feed parsing and file generation

      - name: Commit new episodes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          branch: main
          commit_message: "Update episodes"
          file_pattern: "src/data/episodes/*.md"
