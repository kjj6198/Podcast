name: Podcast Parser

on:
  push:
    branches:
      - main

jobs:
  parse_podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install node
        uses: actions/setup-node@v2

      - name: Install dependencies
        run: |
          npm install rss-parser

      - name: Parse Podcast RSS Feed
        id: parse_feed
        run: |
          node parsePodcast.js  # This script should handle the RSS feed parsing and file generation

      - name: Commit new episodes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "Add new podcast episodes" || echo "No changes to commit"
          git push
