name: Podcast Parser

on:
  push:
    branches:
      - main

jobs:
  parse_podcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Install node
        uses: actions/setup-node@v2

      - name: Install dependencies
        run: |
          npm install rss-parser

      - name: Parse Podcast RSS Feed
        id: parse_feed
        run: |
          node ./scripts/parsePodcast.js  # This script should handle the RSS feed parsing and file generation

      - name: Commit new episodes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          branch: main
          commit_message: "Update episodes"
          file_pattern: "src/data/episodes/*.md"
